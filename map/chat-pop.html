<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Table chat</title>
<link rel="stylesheet" href="ssdns-map.css?v=0.3.35-float">
</head>
<body class="ssdns-chat-pop">
<header class="ssdns-chat-overlay-bar">
  <strong>Table chat</strong>
  <span class="ssdns-chat-filters" data-act="chatFilters">
    <button type="button" data-chat-filter="all">All</button>
    <button type="button" data-chat-filter="rolls">Rolls</button>
    <button type="button" data-chat-filter="talk">Talk</button>
  </span>
  <button type="button" id="popCollapse">Hide</button>
  <button type="button" id="popDock">Dock</button>
</header>
<p class="fine" id="popNote" hidden>Open this window from the map chat.</p>
<div class="ssdns-chat-overlay-feed" id="popFeed" data-act="popFeed"></div>
<form class="ssdns-chat-overlay-form" id="popSend">
  <input id="popText" placeholder="Chat or /roll" autocomplete="off" aria-label="Chat message">
  <button type="submit">Send</button>
</form>
<script src="../assets/js/apply-guard.js?v=0.3.35-float"></script>
<script src="ssdns-map-chat.js?v=0.3.35-float"></script>
<script>SSDNSMapChat.bootPopup();</script>
</body>
</html>
