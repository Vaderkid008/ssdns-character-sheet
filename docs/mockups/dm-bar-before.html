<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DM map bar, as it is</title>
<link rel="stylesheet" href="mock.css">
</head>
<body>
<div class="page">
  <p class="kicker">Mock-up · not in the app</p>
  <h1>Map bar today</h1>
  <p class="note">Edit tokens sits in the left column under five other switches. Move party here is inside Maps ▾. The floor chips name whoever is standing there.</p>
  <div class="shot" id="before">
    <div class="bar">
      <span class="badge">DM</span>
      <label class="grid">Grid <input type="range" min="1" max="3" value="1" aria-label="Grid"></label>
      <button type="button">?</button>
      <span class="zoom">1.00×</span>
      <button type="button">Reset view</button>
      <button type="button">Challenge</button>
      <button type="button">Maps ▾</button>
      <span class="grow"></span>
    </div>
    <div class="strip" aria-label="Floors">
      <button type="button" class="is-on">Saloon: Jolene, Caleb</button>
      <button type="button">Upstairs: Mira (prep)</button>
    </div>
    <div class="stage">
      <aside class="rail" aria-label="Left column">
        <button type="button">Ping</button>
        <button type="button">Ruler</button>
        <h2>Containers</h2>
        <button type="button">Place</button>
        <h2>View &amp; Fog</h2>
        <button type="button">Effects: ON</button>
        <button type="button">Pills: Normal</button>
        <button type="button">Show downed: OFF</button>
        <button type="button">Fog: ON</button>
        <button type="button">Show Player FOV: ON</button>
        <button type="button">Edit tokens</button>
        <p class="caption">The column keeps going: reveal, hide, walls, doors.</p>
      </aside>
      <div class="map" role="img" aria-label="Map grid"></div>
    </div>
  </div>
</div>
</body>
</html>
